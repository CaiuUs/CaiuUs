# Salve este arquivo no repositório CaiuUs/CaiuUs em:
#   .github/workflows/snake.yml
#
# Ele gera a "cobrinha" que come o seu gráfico de contribuições e publica
# o SVG na branch `output`. Roda sozinho a cada 12 horas.
#
# Depois do primeiro run: Settings > Actions > General > Workflow permissions
# precisa estar em "Read and write permissions".

name: Gerar cobrinha de contribuições

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Gerar SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
